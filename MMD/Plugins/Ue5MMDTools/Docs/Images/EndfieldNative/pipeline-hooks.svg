<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1400" viewBox="0 0 1280 1400" role="img" aria-labelledby="title desc">
  <title id="title">插件函数在原生延迟管线中的接入位置</title>
  <desc id="desc">UE5.8.3 桌面延迟普通 opaque 和 masked 材质的入口示意。A 是材质 Custom 的 PrepareSurface，B 是原生灯光数据准备后、外层加权累加前的 EvaluatePerLight。C 是原生 BRDF 和 AO 加权后的间接光 Process：SSGI 和非 async Lumen 在直射光前合成；async Lumen 只剩 Composite 时在直射光后合成，同一份贡献只选择一个位置。GI 为 Lumen 时跳过 D，反射已在 C 合成；其余路径可使用 D 的独立天空与反射合成入口。本图不是固定 GPU 串行时间轴，插件函数嵌入已有 pass，没有新增完整光照 pass。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#3b76b5"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill: #172b45; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52657b; }
      .pass { font-size: 22px; font-weight: 700; }
      .hook { font-size: 18px; font-weight: 700; fill: #23785e; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #52657b; }
      .side-title { font-size: 20px; font-weight: 700; }
      .source { font-size: 14px; fill: #52657b; }
      .foot { font-size: 17px; font-weight: 700; fill: #245b98; }
    </style>
  </defs>
  <rect width="1280" height="1400" fill="#ffffff"/>
  <text x="40" y="53" class="title">插件函数在原生延迟管线中的接入位置</text>
  <text x="40" y="86" class="subtitle">桌面延迟 · 常规 opaque / masked · UE5.8.3 / CL58210709</text>
  <text x="40" y="114" class="subtitle">C 有两处条件位置；主列显示入口与依赖，不是固定 GPU 串行时间轴。</text>

  <rect x="40" y="140" width="760" height="104" rx="12" fill="#edf4fc" stroke="#b9cce3" stroke-width="1.5"/>
  <text x="62" y="174" class="pass">BasePass</text>
  <text x="62" y="203" class="hook">A · 材质 Custom / PrepareSurface</text>
  <text x="62" y="233" class="body">准备法线、PatternUV 等输入，写入现有原生材质数据</text>
  <path d="M 420 245 V 269" fill="none" stroke="#3b76b5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="40" y="276" width="760" height="100" rx="12" fill="#f4f7fb" stroke="#ced8e5" stroke-width="1.5"/>
  <text x="62" y="308" class="pass">原生阴影数据准备（原流程）</text>
  <text x="62" y="337" class="body">VSM / ShadowDepth / Projection，准备真实遮挡数据</text>
  <text x="62" y="365" class="small">具体调度可交错；B 消费已就绪的原生 ShadowTerms</text>
  <path d="M 420 377 V 401" fill="none" stroke="#3b76b5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="40" y="408" width="760" height="132" rx="12" fill="#edf8f3" stroke="#8cbdaa" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="440" class="pass">C 早 · 条件合成</text>
  <text x="62" y="470" class="hook">DiffuseIndirectComposite / Process</text>
  <text x="62" y="499" class="body">SSGI，或非 async Lumen（StepsLeft = All）</text>
  <text x="62" y="528" class="small">原生 BRDF / AO 加权后，SceneColor 合成前</text>
  <path d="M 420 541 V 565" fill="none" stroke="#3b76b5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="40" y="572" width="760" height="156" rx="12" fill="#edf4fc" stroke="#b9cce3" stroke-width="1.5"/>
  <text x="62" y="604" class="pass">B · RenderLights</text>
  <text x="62" y="634" class="hook">SubstrateDeferredLighting → EvaluatePerLight</text>
  <text x="62" y="661" class="small">DeferredLightPixelShaders / 可选 Clustered</text>
  <text x="62" y="689" class="body">原生最终 ShadowTerms + AreaLight 准备后</text>
  <text x="62" y="716" class="body">外层灯色 / LightMask 加权与逐灯累加前</text>
  <path d="M 420 729 V 753" fill="none" stroke="#3b76b5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="40" y="760" width="760" height="132" rx="12" fill="#edf8f3" stroke="#8cbdaa" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="792" class="pass">C 晚 · 条件合成</text>
  <text x="62" y="822" class="hook">DiffuseIndirectComposite / Process</text>
  <text x="62" y="851" class="body">async Lumen：只剩 Composite 时</text>
  <text x="62" y="880" class="small">原生 BRDF / AO 加权后，SceneColor 合成前</text>
  <path d="M 420 893 V 917" fill="none" stroke="#3b76b5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="40" y="924" width="760" height="132" rx="12" fill="#edf4fc" stroke="#b9cce3" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="956" class="pass">D · ReflectionEnvironment（可选）</text>
  <text x="62" y="986" class="hook">TMMDEndfieldNativeIndirect::Process</text>
  <text x="62" y="1015" class="body">独立天空 / capture / 反射贡献的合成位置</text>
  <text x="62" y="1044" class="small">GI = Lumen 时直接跳过，反射已在 C 合成</text>
  <path d="M 420 1057 V 1081" fill="none" stroke="#3b76b5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="40" y="1088" width="760" height="84" rx="12" fill="#f4f7fb" stroke="#ced8e5" stroke-width="1.5"/>
  <text x="62" y="1120" class="pass">后续 SSS / 透明 / 后处理</text>
  <text x="62" y="1150" class="body">未接管，仍按 UE 原流程运行</text>

  <rect x="880" y="142" width="360" height="216" rx="12" fill="#ffffff" stroke="#c3ccd9" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="900" y="177" class="side-title">异步与并行调度</text>
  <text x="900" y="210" class="body">Lumen GI / 反射</text>
  <text x="900" y="239" class="body">可异步提前计算</text>
  <text x="900" y="275" class="body">RDG 等待依赖就绪后合成</text>
  <text x="900" y="311" class="small">虚线表示依赖与分支，不是计时</text>
  <path d="M 1050 359 V 385 H 1260 V 882 H 852 V 824 H 807" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dashed)"/>

  <rect x="880" y="422" width="360" height="192" rx="12" fill="#ffffff" stroke="#c3ccd9" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="900" y="457" class="side-title">C 早 / C 晚：选一个</text>
  <text x="900" y="489" class="body">同一份 GI / 反射贡献</text>
  <text x="900" y="517" class="body">按路径选择一个合成位置</text>
  <text x="900" y="547" class="hook">只合成一次，不重复处理</text>
  <text x="900" y="578" class="small">两处是同一 shader / Process</text>
  <path d="M 879 499 H 807" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dashed)"/>

  <rect x="880" y="676" width="360" height="174" rx="12" fill="#edf8f3" stroke="#b9d9cd" stroke-width="1.5"/>
  <text x="900" y="711" class="side-title">嵌入现有 pass</text>
  <text x="900" y="743" class="body">A / B / C / D 是函数接入点</text>
  <text x="900" y="772" class="body">没有新增完整光照 pass</text>
  <text x="900" y="803" class="small">沿用 UE 原生材质存储与着色模型</text>
  <text x="900" y="830" class="small">不新增 GBuffer / ShadingModelID</text>

  <rect x="880" y="910" width="360" height="174" rx="12" fill="#ffffff" stroke="#c3ccd9" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="900" y="945" class="side-title">GI = Lumen：跳过 D</text>
  <text x="900" y="977" class="body">反射已在 C 中合成</text>
  <text x="900" y="1006" class="body">非 Lumen GI 下，D 可处理</text>
  <text x="900" y="1035" class="body">独立天空 / capture / 反射</text>
  <text x="900" y="1065" class="source">shader：ReflectionEnvironmentPixelShader.usf</text>
  <path d="M 879 1015 H 807" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dashed)"/>

  <text x="40" y="1231" class="foot">C 的先后取决于 async 状态；同一份 GI / 反射贡献只合成一次。</text>
  <text x="40" y="1260" class="subtitle">示意的是入口位置与条件；GPU 可并行，阴影调度可与其他阶段交错。</text>
  <text x="40" y="1294" class="source">来源：UE5.8.3 / CL58210709 · DeferredShadingRenderer.cpp : 3430 / 3468 / 3519 / 3529 / 4312</text>
  <text x="40" y="1326" class="source">GI 条件与 D：IndirectLightRendering.cpp : 1100–1107 / 1168–1169 / 2165 / 2243–2246</text>
  <text x="40" y="1366" class="source">绘制日期：2026-10-14 · 机制示意 · 不代表最终画质</text>
</svg>

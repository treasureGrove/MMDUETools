<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
  <title id="title">同一个材质的原生后端数据流程</title>
  <desc id="desc">同一份原生材质数据供直射光与间接光路径读取。UE 提供每灯参数和真实阴影，插件计算 BSDF 响应，UE 按原流程加权累加；GI、Lumen 与反射结果经插件处理后也由 UE 合成到 SceneColor。这不是把角色独立渲染两遍再叠图，没有新增 GBuffer 或 ShadingModelID。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#3b76b5"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#23785e"/>
    </marker>
    <style>
      text { font-family: 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill: #172b45; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52657b; }
      .node-title { font-size: 22px; font-weight: 700; text-anchor: middle; }
      .node-body { font-size: 17px; text-anchor: middle; fill: #52657b; }
      .branch { font-size: 18px; font-weight: 700; fill: #245b98; }
      .statement { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .footer { font-size: 16px; text-anchor: middle; fill: #52657b; }
    </style>
  </defs>
  <rect width="1280" height="960" fill="#ffffff"/>
  <text x="40" y="55" class="title">原生后端如何接入同一个材质</text>
  <text x="40" y="88" class="subtitle">插件改变着色响应；灯光、真实阴影、间接光和原生合成继续由 UE 提供。</text>

  <rect x="440" y="112" width="400" height="76" rx="12" fill="#f4f7fb" stroke="#ced8e5" stroke-width="1.5"/>
  <text x="640" y="144" class="node-title">同一个角色材质</text>
  <text x="640" y="171" class="node-body">材质输入与原生 Toon Profile</text>
  <path d="M 640 189 V 207" fill="none" stroke="#3b76b5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="360" y="212" width="560" height="88" rx="12" fill="#edf4fc" stroke="#b9cce3" stroke-width="1.5"/>
  <text x="640" y="248" class="node-title">UE 原生材质存储</text>
  <text x="640" y="277" class="node-body">颜色、法线、粗糙度、Toon Profile ID 等</text>
  <path d="M 640 301 V 320 H 315 V 347" fill="none" stroke="#3b76b5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M 640 320 H 965 V 347" fill="none" stroke="#3b76b5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <circle cx="640" cy="320" r="4" fill="#3b76b5"/>
  <text x="60" y="338" class="branch">逐灯直射路径</text>
  <text x="710" y="338" class="branch">GI 与反射路径</text>

  <rect x="60" y="352" width="510" height="80" rx="12" fill="#edf4fc" stroke="#b9cce3" stroke-width="1.5"/>
  <text x="315" y="386" class="node-title">UE：每盏灯的原生数据</text>
  <text x="315" y="415" class="node-body">灯光参数、衰减和真实阴影</text>
  <path d="M 315 433 V 461" fill="none" stroke="#3b76b5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="60" y="466" width="510" height="80" rx="12" fill="#edf8f3" stroke="#b9d9cd" stroke-width="1.5"/>
  <text x="315" y="500" class="node-title">插件 .ush：BSDF 响应</text>
  <text x="315" y="529" class="node-body">决定该灯的漫反射 / 高光响应</text>
  <path d="M 315 547 V 575" fill="none" stroke="#23785e" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="60" y="580" width="510" height="80" rx="12" fill="#edf4fc" stroke="#b9cce3" stroke-width="1.5"/>
  <text x="315" y="614" class="node-title">UE：原有加权与逐灯累加</text>
  <text x="315" y="643" class="node-body">外层灯色 / LightMask 等按原流程施加一次</text>

  <rect x="710" y="352" width="510" height="80" rx="12" fill="#edf4fc" stroke="#b9cce3" stroke-width="1.5"/>
  <text x="965" y="386" class="node-title">UE：GI / Lumen / 反射</text>
  <text x="965" y="415" class="node-body">提供原生间接光、反射与 AO 结果</text>
  <path d="M 965 433 V 461" fill="none" stroke="#3b76b5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="710" y="466" width="510" height="80" rx="12" fill="#edf8f3" stroke="#b9d9cd" stroke-width="1.5"/>
  <text x="965" y="500" class="node-title">插件 .ush：处理合成结果</text>
  <text x="965" y="529" class="node-body">在原生 BRDF 合成后调整漫反射 / 高光</text>
  <path d="M 965 547 V 575" fill="none" stroke="#23785e" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="710" y="580" width="510" height="80" rx="12" fill="#edf4fc" stroke="#b9cce3" stroke-width="1.5"/>
  <text x="965" y="614" class="node-title">UE：原有颜色累加</text>
  <text x="965" y="643" class="node-body">保留原生曝光、分离输出与混合流程</text>

  <path d="M 315 661 V 698 H 631" fill="none" stroke="#3b76b5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M 965 661 V 698 H 649" fill="none" stroke="#3b76b5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <circle cx="640" cy="698" r="6" fill="#3b76b5"/>
  <path d="M 640 705 V 725" fill="none" stroke="#3b76b5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="440" y="730" width="400" height="78" rx="12" fill="#f4f7fb" stroke="#ced8e5" stroke-width="1.5"/>
  <text x="640" y="764" class="node-title">SceneColor</text>
  <text x="640" y="792" class="node-body">后续仍按 UE 正常流程处理</text>

  <text x="640" y="855" class="statement">两路复用同一份材质数据，不是渲染两遍再叠图。</text>
  <text x="640" y="885" class="footer">沿用 UE 的材质存储和着色模型；未新增 GBuffer 或 ShadingModelID。</text>
  <text x="640" y="913" class="footer">旧灯光 RT 仍在运行；当前不据此宣称性能已降低。</text>
  <text x="640" y="945" class="footer">机制示意 · 不代表最终画质</text>
</svg>

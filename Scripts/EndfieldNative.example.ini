; 将这些设置合并到使用插件的工程 Config/DefaultEngine.ini，之后重启并完整 Cook。
; 不要覆盖原文件；只在需要 Endfield 原生后端的项目中显式启用。
[Ue5MMDTools.EndfieldNativeBackend]
Enabled=True
ProbeMode=2
IndirectDiffuseScale=1
IndirectSpecularScale=1

[/Script/Engine.RendererSettings]
r.Substrate=True
r.Substrate.Experimental.ToonUnifiedDiffuse=0
r.Substrate.ProjectGBufferFormat=1
r.Shadow.Virtual.Enable=1

; 本批实际验证的是 Windows D3D12 SM6；保留工程其它 RHI 配置。
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[ConsoleVariables]
r.Substrate.ToonProfile.Resolution=256

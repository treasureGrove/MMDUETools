; Ue5MMDTools 本地化目标配置
;
; 源码里的面板文字已经用 LOCTEXT 标注，命名空间为 Ue5MMDToolsUI，
; 源语言是简体中文（NativeCulture=zh-Hans）。
;
; 路径相对于运行命令的工程根目录。插件按 Plugins/Ue5MMDTools 放置；
; 开发宿主里路径不同时，改 SearchDirectoryPaths 与 SourcePath 即可。
;
; 用法（无窗口编辑器，不需要打开前台界面）：
;   UnrealEditor-Cmd.exe <工程>.uproject -run=GatherText ^
;     -config="Plugins/Ue5MMDTools/Config/Localization/Ue5MMDTools.ini" ^
;     -unattended -nosplash
;
; 产物：Content/Localization/Ue5MMDTools/<Culture>/Ue5MMDTools.locres
; 翻译写在 Ue5MMDTools.po 里，改完重跑同一命令即可重新编译资源。

[CommonSettings]
SourcePath=Plugins/Ue5MMDTools/Content/Localization/Ue5MMDTools
DestinationPath=Plugins/Ue5MMDTools/Content/Localization/Ue5MMDTools
ManifestName=Ue5MMDTools.manifest
ArchiveName=Ue5MMDTools.archive
PortableObjectName=Ue5MMDTools.po
ResourceName=Ue5MMDTools.locres
NativeCulture=zh-Hans
CulturesToGenerate=en
CulturesToGenerate=ja

; 收集源码里的 LOCTEXT
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Plugins/Ue5MMDTools/Source/
FileNameFilters=*.cpp
FileNameFilters=*.h
ShouldGatherFromEditorOnlyData=false

; 写清单
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

; 写归档
[GatherTextStep2]
CommandletClass=GenerateGatherArchive

; 导入已翻译的 PO
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

; 生成 .locres
[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource

; 导出 PO，便于翻译
[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true
